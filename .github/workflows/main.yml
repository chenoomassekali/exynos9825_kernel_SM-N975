name: Build Kernel Nethunter d2s

on:
  push:
    branches: [ cruel ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [N975F]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential bc flex bison libssl-dev python3 git

      - name: Create dummy adb
        run: |
          sudo tee /usr/local/bin/adb <<< '#!/bin/bash'
          sudo tee -a /usr/local/bin/adb <<< 'echo "d2s"'
          sudo chmod +x /usr/local/bin/adb

      - name: Prepare build files
        run: |
          # Buat folder cruel jika belum ada
          mkdir -p cruel
          # Cari file build.mkbootimg yang tersedia (d2s atau polos)
          if [ -f cruel/build.mkbootimg.d2s ]; then
            cp cruel/build.mkbootimg.d2s cruel/build.mkbootimg.N975F
            echo "Copied build.mkbootimg.d2s"
          elif [ -f cruel/build.mkbootimg ]; then
            cp cruel/build.mkbootimg cruel/build.mkbootimg.N975F
            echo "Copied build.mkbootimg"
          else
            # Buat file dummy agar build tetap berjalan
            echo "# Dummy mkbootimg for N975F" > cruel/build.mkbootimg.N975F
            echo "WARNING: Dummy file created"
          fi
          # Tampilkan isi file untuk verifikasi
          ls -la cruel/build.mkbootimg.N975F
          cat cruel/build.mkbootimg.N975F

      - name: Kernel Configure
        run: |
          chmod +x cruelbuild
          ./cruelbuild config \
            model=${{ matrix.model }} \
            name="Nethunter-OneUI4.1" \
            toolchain=proton \
            +magisk \
            +nohardening \
            +wireguard \
            +cifs \
            +sdfat \
            +ntfs \
            +morosound \
            +boeffla_wl_blocker \
            os_patch_level=2099-12

      - name: Build Kernel
        run: ./cruelbuild build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nethunter-d2s-OneUI4.1-boot
          path: build/**/*
    
