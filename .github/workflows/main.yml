name: Build Kernel Nethunter d2s

on:
  push:
    branches: [ cruel ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [N975F]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential bc flex bison libssl-dev python3

      - name: Create dummy adb
        run: |
          # Buat file tiruan adb yang mengeluarkan "d2s"
          sudo tee /usr/local/bin/adb <<< '#!/bin/bash'
          sudo tee -a /usr/local/bin/adb <<< 'echo "d2s"'
          sudo chmod +x /usr/local/bin/adb
          # Pastikan adb bisa dipanggil
          adb

      - name: Kernel Configure
        run: |
          chmod +x cruelbuild
          ./cruelbuild config \
            model=${{ matrix.model }} \
            name="Nethunter-OneUI4.1" \
            toolchain=clang \
            +magisk \
            +nohardening \
            +wireguard \
            +cifs \
            +sdfat \
            +ntfs \
            +morosound \
            +boeffla_wl_blocker \
            os_patch_level=2099-12

      - name: Build Kernel
        run: ./cruelbuild build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nethunter-d2s-OneUI4.1-boot
          path: build/**/*
